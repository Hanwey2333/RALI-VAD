model:
  clip_dim: 768
  i3d_dim: 2048
  input_dim: 2816
  embed_dim: 512
  visual_length: 256
  visual_heads: 1
  visual_layers: 2
  attention_window: 8
  similarity_threshold: 0.7

stage1:
  epochs: 20
  topk_divisor: 16
  sparsity_weight: 0.001

rali:
  alpha: 0.65
  tau: 0.20
  reliability_floor: 0.05
  semantic_query_topk: 50

nar:
  epochs: 40
  target_momentum: 0.90
  sharpening_weight: 0.5
  warmup_epochs: 5

optimization:
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.01
  normal_batch_size: 4
  abnormal_batch_size: 4
  gradient_clipping: false
  formal_seeds: [0, 1, 2]
